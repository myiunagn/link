site_name: Link 语言手册
site_description: Link — 一门为"互联"而生的语言:从 IoT 设备到游戏后端,再到多语言胶水层
site_url: https://myiunagn.github.io/linkdoc/
repo_url: https://github.com/myiunagn/linkdoc
repo_name: myiunagn/linkdoc
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    logo: material/link-variant

nav:
  - 首页: index.md
  - 开始:
      - 介绍: introduction.md
      - 安装: installation.md
      - 快速开始: quickstart.md
      - REPL 交互模式: repl.md
  - 语言基础:
      - 变量与类型: basics/types.md
      - 运算符: basics/operators.md
      - 控制流: basics/control-flow.md
      - 函数: basics/functions.md
      - 列表与字符串: basics/collections.md
  - 多语言互联:
      - 概述: ffi/overview.md
      - C 互连: ffi/c.md
      - Python 互连: ffi/python.md
      - C++ 互连: ffi/cpp.md
      - WebAssembly 互连: ffi/wasm.md
      - Java 互连: ffi/java.md
      - HTML/JS 互连: ffi/html.md
      - 进程桥接互连: ffi/process.md
  - 示例: examples.md
  - 设计规格: spec.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en
        - ja

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/myiunagn/linkdoc
  generator: false

extra_css:
  - assets/styles.css
