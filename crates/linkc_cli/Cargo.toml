[package]
name = "linkc_cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "link"
path = "src/main.rs"

[dependencies]
linkc_lexer = { path = "../linkc_lexer" }
linkc_parser = { path = "../linkc_parser" }
linkc_sema = { path = "../linkc_sema" }
linkc_interpreter = { path = "../linkc_interpreter" }
linkc_bindgen = { path = "../linkc_bindgen" }
linkc_codegen = { path = "../linkc_codegen" }
linkc_llvm = { path = "../linkc_llvm" }
linkc_lsp = { path = "../linkc_lsp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-tungstenite = "0.24"
serde_json = "1"
futures-util = "0.3"
